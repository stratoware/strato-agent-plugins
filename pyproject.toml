[project]
name = "strato-plugin-checks"
version = "0.0.0"
requires-python = ">=3.10"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "jsonschema>=4.25,<5",
    "keyring==25.7.0",
    "markdown-it-py>=3,<5",
    "pytest>=8.4,<10",
    "pyyaml>=6,<7",
    "ruff>=0.14,<1",
    "tomlkit==0.13.3",
    "truststore==0.10.4",
    "typer>=0.12,<1",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
