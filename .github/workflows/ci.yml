name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Package tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.4"
          python-version: ${{ matrix.python }}
      - name: Check installer
        run: uv run --locked --script plugins/strato/setup/setup_codex.py --help
      - name: Check bundled examples
        run: uv run --script plugins/strato/skills/strato-verification-sync/scripts/validate_verification.py plugins/strato/skills/strato-verification-sync/assets/test-mapping.example.json --results plugins/strato/skills/strato-verification-sync/assets/test-results.example.json

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.4"
          python-version: "3.14"
      - name: Lint distributed Python
        run: uvx --from ruff==0.16.10 ruff check --target-version py310 --select E4,E7,E9,F,I,UP plugins
